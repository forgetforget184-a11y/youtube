name: Render Explainer Video

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration in seconds (enter "full" for complete 15-min video, or e.g. "30" for preview)'
        required: true
        default: 'full'
      voice:
        description: 'TTS Voice (if generating voiceover via Edge-TTS)'
        required: true
        default: 'en-US-GuyNeural'
      music_level:
        description: 'Music bed volume relative to voice (0.10 to 0.20)'
        required: true
        default: '0.15'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow edge-tts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright & Chromium
        working-directory: .agents/skills/crayon-capital-explainer/engine
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Generate Voiceover & Video Assets
        run: |
          mkdir -p explainer/hunt_brothers/{anim,audio,out,work}
          
          # If voiceover does not exist, synthesize it
          if [ ! -f "explainer/hunt_brothers/audio/voice.mp3" ]; then
            echo "Synthesizing voiceover with Edge-TTS..."
            python -c "
          import asyncio, edge_tts
          async def main():
              with open('explainer/hunt_brothers/work/script.txt', 'r', encoding='utf-8') as f:
                  text = ' '.join([line.strip() for line in f if line.strip()])
              comm = edge_tts.Communicate(text, '${{ github.event.inputs.voice }}', rate='+5%')
              await comm.save('explainer/hunt_brothers/audio/voice.mp3')
          asyncio.run(main())
          "
          fi

      - name: Execute Procedural Video Render & Audio Mux
        run: |
          DUR_FLAG=""
          if [ "${{ github.event.inputs.duration }}" != "full" ]; then
            DUR_FLAG="--dur ${{ github.event.inputs.duration }}"
          fi

          python render_runner.py \
            --proj explainer/hunt_brothers/anim \
            --voice explainer/hunt_brothers/audio/voice.mp3 \
            --out explainer/hunt_brothers/out/The_Billionaires_Who_Cornered_Silver.mp4 \
            --music-level ${{ github.event.inputs.music_level }} \
            $DUR_FLAG

      - name: Upload Finished Video & Contact Sheet
        uses: actions/upload-artifact@v4
        with:
          name: Explainer-Video-Output
          path: |
            explainer/hunt_brothers/out/*.mp4
            explainer/hunt_brothers/work/contact_sheet.jpg
            explainer/hunt_brothers/work/PLAN.md
          retention-days: 14
