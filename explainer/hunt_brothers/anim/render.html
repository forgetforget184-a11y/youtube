<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'PMarker';src:url('fonts/PermanentMarker-Regular.ttf');}
@font-face{font-family:'PHand';src:url('fonts/PatrickHand-Regular.ttf');}
html,body{margin:0;background:#000}canvas{display:block}
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<!-- engine core, Crayon toolkit, then story. story.js must call TM.config(...) -->
<script src="scene.js"></script>
<script src="characters.js"></script>
<script src="props.js"></script>
<script src="crayon.js"></script>
<script src="cc.js"></script>
<script src="cc_props.js"></script>
<script src="captions.js"></script>
<script src="story.js"></script>
<script>
  (function () {
    const canvas = document.getElementById('stage');
    TM.init(canvas);
    const fontsReady = Promise.all([
      document.fonts.load('80px PMarker'), document.fonts.load('40px PHand')
    ]).catch(() => null);
    Promise.all([fontsReady, Promise.resolve(window.STORY_READY || true)]).then(() => {
      window.renderFrame(0);
      window.ready = true;
    });
  })();
</script>
</body>
</html>
